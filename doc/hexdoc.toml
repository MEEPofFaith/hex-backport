modid = "hexbackport"
book = "hexcasting:thehexbook"

resource_dirs = [  # top takes priority
    "resources",
    "{$_project.src}/main/resources",
    { path="{$_project.src}/generated/resources", required=false },
    { modid="hexcasting" },
    { modid="minecraft" },
    { modid="hexdoc" },
]
export_dir = "src/hexdoc_hexbackport/_export/generated"

[template]
icon = "{$_project.src}/main/resources/assets/hexbackport/icon.png"
include = [
    "hexbackport",
    "hexcasting",
    "hexdoc",
]

[template.args]
mod_name = "HexBackport"
author = "MEEPofFaith"
show_landing_text = false

[extra.hexcasting]
# regexes for parsing pattern registry files - if some or all of your patterns aren't being detected by hexdoc, this may need to be updated
# NOTE: "!Raw" means "don't apply variable interpolation to this value"
_pattern_regex = { "!Raw" = '(register)\("(?P<name>[^"]+)"?,\s"(?P<signature>[qweasd]+)",\sHexDir\.(?P<startdir>\w+)' }

[[extra.hexcasting.pattern_stubs]]
path = "{$_project.src}/main/kotlin/com/meepoffaith/hexbackport/init/Patterns.kt"
regex = "{^_pattern_regex}"

# source paths

[_project]
src = "../src"
